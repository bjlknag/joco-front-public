<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>행운의 로또 번호 생성기</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="main.js" defer></script>
</head>
<body>
    <div class="theme-switcher">
        <input type="checkbox" id="theme-toggle" class="theme-toggle-checkbox">
        <label for="theme-toggle" class="theme-toggle-label">
            <span class="sun">☀️</span>
            <span class="moon">🌙</span>
        </label>
    </div>

    <main class="app-container">
        <h1 class="app-title">🍀 행운의 로또 번호 생성기 🍀</h1>
        <p class="app-description">버튼을 눌러 당신의 행운 번호를 확인하세요!</p>
        
        <div id="lotto-numbers-display" class="lotto-numbers-container">
            <!-- 로또 번호가 여기에 동적으로 추가됩니다. -->
        </div>
        
        <div class="button-group">
            <button id="generate-btn" class="action-button">번호 생성</button>
            <button id="copy-btn" class="secondary-button" disabled>번호 복사</button>
        </div>
    </main>

</body>
</html>
